[project]
name = "customer-support"
version = "0.1.0"
description = "Adaptive Multi-Agent Customer Support System"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "chromadb>=0.6",
    "pydantic>=2",
    "httpx>=0.28",
    "openai>=2.45.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "langchain-openai>=1.3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "stripe>=11.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
